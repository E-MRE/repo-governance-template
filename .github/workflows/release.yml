# "Create or update draft release" steps below list Node/npm commands and a single
# example asset set (main.js, manifest.json, styles.css — an Obsidian plugin's build
# output). Replace them with this project's real build command and real artifact
# paths (an .apk/.aab, a .jar, a Python wheel, ...). The tag-validation step at the
# top and the publish step at the bottom are stack-agnostic and need no changes.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (plain SemVer, e.g. 1.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build, attest, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Determine release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected plain SemVer (e.g. 1.2.0); non-SemVer and branch names like 'main' are rejected."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.tag }}

      # --- TODO: replace this build block with the project's real toolchain/build. ---
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build
      # --- end TODO block ---

      # TODO: replace the asset list below (also used by the attest/upload steps)
      # with this project's real release artifact paths.
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/**

      - name: Create or update draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for tag $TAG. Uploading assets to existing release..."
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating draft release for tag $TAG..."
            gh release create "$TAG" dist/* \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: >-
          gh release edit "$TAG" --draft=false
